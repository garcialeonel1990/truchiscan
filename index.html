<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Devices Scanner</title>
<style>
  /* ===== Design tokens (contraste WCAG AA medido en claro y oscuro) ===== */
  :root {
    color-scheme: light dark;
    --bg: #F2F2F7; --surface: #FFFFFF; --fill: #E5E5EA; --hair: #C6C6C8;
    --text: #000000; --text2: #3C3C43; --text3: #6C6C70; --sep: #8E8E93;
    --accent: #0058D0; --accent-text: #0058D0; --on-accent: #FFFFFF;
    --danger: #C4001A; --danger-text: #C4001A; --ok: #1E7B34; --warn: #A35200; --warn-border: #C26100;
    --r-ctl: 10px; --r-card: 14px; --r-btn: 20px; --r-sheet: 28px;
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;
    --tap: 48px; --tap-main: 56px; --tabs-h: 64px;
    --dur: 180ms;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
    --material: color-mix(in srgb, var(--surface) 82%, transparent);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000; --surface: #1C1C1E; --fill: #2C2C2E; --hair: #38383A;
      --text: #FFFFFF; --text2: #EBEBF5; --text3: #AEAEB2;
      --accent: #0060DF; --accent-text: #4DA3FF;
      --danger: #D70022; --danger-text: #FF6961; --ok: #32D74B; --warn: #FFB340; --warn-border: #FF9F0A;
    }
  }

  /* ===== Base ===== */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  body { margin: 0 auto; max-width: 600px; padding: calc(env(safe-area-inset-top) + var(--s5)) var(--s4) 0;
    background: var(--bg); color: var(--text); font: 17px/1.35 -apple-system, system-ui, sans-serif; -webkit-text-size-adjust: 100%; }
  [hidden] { display: none !important; }
  h1 { margin: var(--s2) 0 var(--s4); font: 700 28px/1.2 -apple-system, system-ui, sans-serif; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .ic { width: 24px; height: 24px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--accent-text); outline-offset: 2px; }

  /* ===== Escanear: cámara ===== */
  #cam { position: relative; height: min(46svh, 420px); margin-bottom: var(--s4); background: #000; border-radius: var(--r-card); overflow: hidden; }
  #cam video { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); visibility: hidden; }
  .pill { position: absolute; z-index: 1; left: 50%; transform: translateX(-50%); margin: 0; padding: var(--s2) var(--s4); border-radius: 999px; background: #000000B3; color: #FFF; font: 600 16px system-ui; white-space: nowrap; }
  #aim { top: var(--s3); }
  #zoom { position: absolute; z-index: 1; left: 50%; bottom: var(--s3); transform: translateX(-50%); display: flex; gap: var(--s1); padding: var(--s1); border-radius: 999px; background: #000000B3; }
  #zoom button { width: var(--tap); height: var(--tap); border-radius: 50%; color: #FFF; font: 600 16px system-ui; }
  #zoom button.on { background: #FFFFFF33; color: #FFD60A; }
  #ok { position: absolute; z-index: 2; inset: 0; display: flex; align-items: center; justify-content: center; padding: var(--s4); background: #000000CC; color: #32D74B; font: 700 24px var(--mono); text-align: center; word-break: break-all; }

  /* ===== Escanear: ficha del equipo ===== */
  .card { margin-bottom: var(--s4); padding: var(--s4); border-radius: var(--r-card); background: var(--surface); }
  .card-h { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); }
  .card-h h2 { margin: 0; font: 600 20px system-ui; }
  .meta { margin: var(--s1) 0 0; color: var(--text3); font-size: 16px; }
  .chip { flex: none; padding: var(--s1) var(--s3); border-radius: 999px; background: var(--fill); color: var(--text); font: 600 16px system-ui; }
  .chip.ok { color: var(--ok); }
  .bar5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: var(--s1); margin: var(--s3) 0 var(--s2); }
  .bar5 i { height: 6px; border-radius: 3px; background: var(--fill); transition: background var(--dur); }
  .bar5 i.on { background: var(--accent-text); }
  .bar5.done i { background: var(--ok); }
  .row { display: flex; align-items: center; gap: var(--s3); width: 100%; min-height: var(--tap-main); padding: var(--s2) 0; border-top: 1px solid var(--hair); text-align: left; }
  .row .lbl { width: 92px; flex: none; color: var(--text3); font-size: 16px; }
  .row .val { flex: 1; min-width: 0; font-size: 17px; word-break: break-all; }
  .row .mono { font: 600 20px var(--mono); }
  .row .val.empty { color: var(--text3); font: 400 17px system-ui; }
  .row .ic { color: var(--text3); }
  /* Tag y Serial: se escriben a mano o se escanean con el botón de cámara */
  .code-row { display: flex; align-items: center; gap: var(--s3); min-height: var(--tap-main); padding: var(--s2) 0; border-top: 1px solid var(--hair); }
  .code-row label { width: 92px; flex: none; color: var(--text3); font-size: 16px; }
  .code-in { flex: 1; min-width: 0; height: var(--tap); padding: 0 var(--s3); border: 1px solid var(--sep); border-radius: var(--r-ctl);
    background: var(--bg); color: var(--text); font: 600 18px var(--mono); text-transform: uppercase; }
  .code-in::placeholder { color: var(--text3); font: 400 16px system-ui; text-transform: none; }
  .code-in:focus { outline: 3px solid var(--accent-text); outline-offset: 1px; }
  .code-in.bad { border-color: var(--warn-border); }
  .cam-btn { flex: none; display: grid; place-items: center; width: var(--tap); height: var(--tap); border-radius: var(--r-ctl);
    background: color-mix(in srgb, var(--accent) 14%, var(--surface)); color: var(--accent-text); }
  .cam-btn:active { transform: scale(.95); }
  .code-msg { margin: calc(var(--s1) * -1) 0 var(--s2) 104px; color: var(--warn); font-size: 16px; }
  .req { flex: none; padding: 2px var(--s2); border: 1px solid var(--warn-border); border-radius: 999px; color: var(--warn); font: 600 16px system-ui; }
  /* Sin equipo en pantalla: el recuadro es el botón "Nuevo equipo" */
  .big-new { display: flex; flex-direction: column; align-items: center; gap: var(--s2); width: 100%; padding: var(--s6) var(--s5);
    box-shadow: inset 0 0 0 2px var(--accent-text); text-align: center; transition: transform var(--dur); }
  .big-new:active { transform: scale(.98); }
  .plus-circle { display: grid; place-items: center; width: 56px; height: 56px; border-radius: 50%; background: var(--accent); color: var(--on-accent); }
  .plus-circle .ic { width: 28px; height: 28px; stroke-width: 2.5; }
  .big-new .t { color: var(--accent-text); font: 600 20px system-ui; }
  .big-new .s { color: var(--text2); font-size: 16px; }

  /* ===== Acción principal fija abajo (zona del pulgar) ===== */
  #home { padding-bottom: calc(var(--tabs-h) + 150px + env(safe-area-inset-bottom)); }
  .dock { position: fixed; z-index: 5; left: 50%; bottom: calc(var(--tabs-h) + env(safe-area-inset-bottom)); transform: translateX(-50%); width: 100%; max-width: 600px;
    display: grid; gap: var(--s2); padding: var(--s5) var(--s4) var(--s3); background: linear-gradient(to bottom, transparent, var(--bg) var(--s5)); }
  #msg { margin: 0; padding: var(--s3) var(--s4); border-radius: var(--r-ctl); background: var(--surface); color: var(--text2); font-size: 16px; text-align: center; overflow-wrap: anywhere; }
  #msg.warn { color: var(--warn); box-shadow: inset 0 0 0 1px var(--warn-border); }
  .btn-main { display: flex; align-items: center; justify-content: center; gap: var(--s2); width: 100%; min-height: var(--tap-main); border-radius: var(--r-btn);
    background: var(--accent); color: var(--on-accent); font: 600 19px system-ui; transition: transform var(--dur), background-color var(--dur); }
  .btn-main:active { transform: scale(.98); }
  .btn-main.alt { background: var(--fill); color: var(--text); }
  .btn-text { min-height: var(--tap); border-radius: var(--r-ctl); color: var(--accent-text); font: 600 17px system-ui; }
  .btn-sec { min-height: var(--tap-main); border-radius: var(--r-btn); background: var(--fill); color: var(--text); font: 600 17px system-ui; }

  /* ===== Barra inferior ===== */
  .tabs { position: fixed; z-index: 6; left: 50%; bottom: 0; transform: translateX(-50%); width: 100%; max-width: 600px; display: grid; grid-template-columns: 1fr 1fr;
    padding: var(--s1) var(--s2) env(safe-area-inset-bottom); background: var(--material); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-top: 1px solid var(--hair); }
  .tabs button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 56px; color: var(--text3); font: 600 16px system-ui; }
  .tabs button[aria-current="page"] { color: var(--accent-text); }

  /* ===== Hoja inferior de opciones ===== */
  #sheet, #edit { width: 100%; max-width: 600px; max-height: 85svh; margin: auto auto 0; padding: 0; border: 0; border-radius: var(--r-sheet) var(--r-sheet) 0 0; background: var(--surface); color: var(--text); }
  #sheet::backdrop, #edit::backdrop { background: #00000080; }
  #sheet[open], #edit[open] { animation: up var(--dur) ease-out; }
  @keyframes up { from { transform: translateY(24px); opacity: .6; } }
  .sheet-in { display: flex; flex-direction: column; max-height: 85svh; padding: var(--s2) var(--s4) calc(var(--s4) + env(safe-area-inset-bottom)); }
  .grab { flex: none; width: 36px; height: 5px; margin: 0 auto var(--s3); border-radius: 3px; background: var(--sep); }
  .sheet-in h2 { margin: 0 0 var(--s2); font: 600 20px system-ui; text-align: center; }
  #sheetOpts { overflow-y: auto; overscroll-behavior: contain; }
  .opt { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); width: 100%; min-height: var(--tap-main); padding: 0 var(--s2); border-bottom: 1px solid var(--hair); font-size: 17px; text-align: left; }
  .opt .ic { color: var(--accent-text); visibility: hidden; }
  .opt[aria-pressed="true"] { font-weight: 600; }
  .opt[aria-pressed="true"] .ic { visibility: visible; }
  .sheet-acts { flex: none; display: grid; gap: var(--s2); margin-top: var(--s3); }
  .btn-text.danger { color: var(--danger-text); }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  /* ===== Lista ===== */
  #panel { padding-bottom: calc(var(--tabs-h) + 110px + env(safe-area-inset-bottom)); }
  .head { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); min-height: var(--tap); margin: var(--s2) 0 var(--s1); }
  .head h1 { margin: 0; }
  .head .btn-text { padding: 0 var(--s2); }
  /* Botón redondo arriba a la derecha: empezar un escaneo nuevo */
  .icon-btn { flex: none; display: grid; place-items: center; width: var(--tap); height: var(--tap); border-radius: 50%; background: var(--fill); color: var(--text); }
  .icon-btn:active { transform: scale(.94); }
  .icon-btn:disabled { opacity: .4; cursor: default; transform: none; }
  .summary { margin: 0 0 var(--s4); color: var(--text2); font-size: 16px; }
  .summary b { color: var(--warn); font-weight: 600; }
  .group { margin: 0; padding: 0; list-style: none; border-radius: var(--r-card); background: var(--surface); overflow: hidden; }
  .item { display: flex; align-items: center; gap: var(--s3); width: 100%; min-height: 72px; padding: var(--s3) var(--s4); text-align: left; transition: background-color var(--dur); }
  .item:active { background: color-mix(in srgb, var(--text) 6%, var(--surface)); }
  .group li + li .item { box-shadow: inset 0 1px 0 var(--hair); }
  .item .tx { flex: 1; min-width: 0; }
  .item .l1 { display: flex; align-items: baseline; gap: var(--s2); }
  .item .code { font: 600 18px var(--mono); overflow-wrap: anywhere; }
  .item .ser { margin-top: 2px; color: var(--text2); font: 400 16px var(--mono); overflow-wrap: anywhere; }
  .item .l3 { margin-top: 2px; color: var(--text3); font-size: 16px; }
  .item .l3.miss { color: var(--warn); font-weight: 600; }
  .item > .ic { color: var(--text3); }
  /* Estado del registro: anillo vacío, 1-4 de 5 o completo */
  .ring { flex: none; display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; font: 700 14px system-ui; }
  .ring.st0 { box-shadow: inset 0 0 0 2px var(--sep); }
  .ring.st1 { box-shadow: inset 0 0 0 2px var(--warn); color: var(--warn); }
  .ring.st2 { background: var(--ok); color: var(--surface); }
  .ring.st2 .ic { width: 18px; height: 18px; stroke-width: 3; }
  /* Selección */
  .item[aria-checked="true"] { background: color-mix(in srgb, var(--accent) 8%, var(--surface)); }
  .chk { flex: none; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--sep); color: #FFF; }
  .chk .ic { width: 18px; height: 18px; stroke-width: 3; visibility: hidden; }
  [aria-checked="true"] > .chk { background: var(--accent); box-shadow: none; }
  [aria-checked="true"] > .chk .ic { visibility: visible; }
  .empty-list { padding: var(--s6) var(--s5); border-radius: var(--r-card); background: var(--surface); text-align: center; }
  .empty-list .ic { width: 48px; height: 48px; color: var(--text3); stroke-width: 1.6; }
  .empty-list h2 { margin: var(--s3) 0 var(--s2); font: 600 20px system-ui; }
  .empty-list p { margin: 0; color: var(--text2); }
  /* Barra de acciones de la lista (encima de la barra inferior) */
  .acts { display: grid; grid-template-columns: 1fr auto; gap: var(--s2); }
  .acts .btn-sec { padding: 0 var(--s4); }
  .acts .del { color: var(--danger-text); }
  .acts .del .ic { margin-right: var(--s1); }
  .btn-main:disabled { background: var(--fill); color: var(--text3); cursor: default; transform: none; }
  .btn-sec:disabled { opacity: .5; cursor: default; }
  .hint { margin: 0; color: var(--text3); font-size: 16px; text-align: center; }

  /* ===== Hoja de edición y asignación en lote ===== */
  .fields { overflow-y: auto; overscroll-behavior: contain; }
  .sub { margin: 0 0 var(--s3); color: var(--text3); font-size: 16px; text-align: center; }
  .field { margin-bottom: var(--s3); }
  .field-h { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); min-height: var(--tap); }
  .field-h label, .field-h .lab { color: var(--text2); font: 600 16px system-ui; }
  .field-h .btn-text { padding: 0 var(--s2); }
  .chips { display: flex; flex-wrap: wrap; gap: var(--s2); }
  .chips button { min-height: var(--tap); padding: 0 var(--s4); border-radius: 999px; box-shadow: inset 0 0 0 1px var(--sep); font-size: 17px; }
  .chips button[aria-pressed="true"] { background: var(--accent); box-shadow: none; color: var(--on-accent); font-weight: 600; }
  .input { width: 100%; min-height: var(--tap-main); padding: 0 var(--s4); border: 1px solid var(--sep); border-radius: var(--r-ctl); background: var(--bg); color: var(--text); font: 17px system-ui; }
  .input:focus { outline: 3px solid var(--accent-text); outline-offset: 1px; }
  .field .code-in { width: 100%; height: var(--tap-main); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-scan" viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 8v8M10.5 8v8M14 8v8M17 8v8"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-cam" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-reset" viewBox="0 0 24 24"><path d="M20 12a8 8 0 0 1-14.1 5.2M4 12a8 8 0 0 1 14.1-5.2M18.5 3v4h-4M5.5 21v-4h4"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h12M9 12h12M9 18h12M4 6h.01M4 12h.01M4 18h.01"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15V3M8 7l4-4 4 4M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
</svg>

<main id="home">
  <div class="head">
    <h1>Devices Scanner</h1>
    <button id="reset" class="icon-btn" aria-label="Empezar un escaneo nuevo: borra la lista actual"><svg class="ic" aria-hidden="true"><use href="#i-reset"/></svg></button>
  </div>
  <div id="cam" hidden>
    <p id="aim" class="pill"></p>
    <div id="zoom" role="group" aria-label="Zoom" hidden><button data-z="1" aria-label="Zoom 1x">1x</button><button data-z="2" aria-label="Zoom 2x">2x</button><button data-z="3" aria-label="Zoom 3x">3x</button></div>
    <div id="ok" role="status" hidden></div>
  </div>

  <button id="empty" class="card big-new">
    <span class="plus-circle" aria-hidden="true"><svg class="ic"><use href="#i-plus"/></svg></span>
    <span class="t">Nuevo equipo</span>
    <span id="emptySub" class="s">Tocá para cargar el primero</span>
  </button>

  <section id="card" class="card" aria-labelledby="cardTitle" hidden>
    <div class="card-h"><h2 id="cardTitle">Equipo</h2><span id="prog" class="chip"></span></div>
    <p id="cardDate" class="meta"></p>
    <div id="bar5" class="bar5" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="code-row"><label for="tag">Tag</label>
      <input id="tag" class="code-in" data-code="tag" placeholder="Escribí o escaneá" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="next">
      <button class="cam-btn" data-f="tag" aria-label="Escanear Tag con la cámara"><svg class="ic" aria-hidden="true"><use href="#i-cam"/></svg></button></div>
    <p id="msg-tag" class="code-msg" role="alert" hidden></p>
    <div class="code-row"><label for="serial">Serial</label>
      <input id="serial" class="code-in" data-code="serial" placeholder="Escribí o escaneá" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="done">
      <button class="cam-btn" data-f="serial" aria-label="Escanear Serial con la cámara"><svg class="ic" aria-hidden="true"><use href="#i-cam"/></svg></button></div>
    <p id="msg-serial" class="code-msg" role="alert" hidden></p>
    <button class="row" data-pick="ubicacion"><span class="lbl">Ubicación</span><span id="v-ubicacion" class="val"></span><span id="reqU" class="req">Obligatoria</span><svg class="ic" aria-hidden="true"><use href="#i-chev"/></svg></button>
    <button class="row" data-pick="estado"><span class="lbl">Estado</span><span id="v-estado" class="val"></span><svg class="ic" aria-hidden="true"><use href="#i-chev"/></svg></button>
    <button class="row" data-pick="tipo"><span class="lbl">Tipo</span><span id="v-tipo" class="val"></span><svg class="ic" aria-hidden="true"><use href="#i-chev"/></svg></button>
  </section>

  <div class="dock">
    <p id="msg" role="status" aria-live="polite" hidden></p>
    <button id="scan" class="btn-main"></button>
  </div>
</main>

<section id="panel" hidden>
  <div class="head">
    <h1>Lista</h1>
    <button id="pick" class="btn-text">Seleccionar</button>
    <button id="cancel" class="btn-text" hidden>Cancelar</button>
  </div>
  <p id="summary" class="summary" aria-live="polite"></p>
  <div id="emptyList" class="empty-list" hidden>
    <svg class="ic" aria-hidden="true"><use href="#i-list"/></svg>
    <h2>Todavía no hay equipos</h2>
    <p>Los equipos que escanees aparecen acá.</p>
  </div>
  <button id="all" class="item" role="checkbox" aria-checked="false" hidden style="margin-bottom:var(--s2);border-radius:var(--r-card);background:var(--surface)">
    <span class="chk"><svg class="ic" aria-hidden="true"><use href="#i-check"/></svg></span><span class="tx">Seleccionar todos</span>
  </button>
  <ol id="list" class="group" reversed></ol>

  <div class="dock">
    <div id="acts" class="acts">
      <button id="csv" class="btn-main"><svg class="ic" aria-hidden="true"><use href="#i-share"/></svg>Exportar CSV</button>
    </div>
    <div id="selbox" hidden>
      <p id="selHint" class="hint" hidden>Tocá los equipos para marcarlos</p>
      <div class="acts">
        <button id="bulkOpen" class="btn-main">Asignar a <span id="n2">0</span></button>
        <button id="del" class="btn-sec del" aria-label="Borrar seleccionados"><svg class="ic" aria-hidden="true"><use href="#i-trash"/></svg><span id="n">0</span></button>
      </div>
    </div>
  </div>
</section>

<dialog id="edit" aria-labelledby="editTitle">
  <div class="sheet-in">
    <div class="grab" aria-hidden="true"></div>
    <h2 id="editTitle"></h2>

<nav class="tabs" aria-label="Secciones">

  <button id="open"><svg class="ic" aria-hidden="true"><use href="#i-list"/></svg><span>Lista (<span id="count">0</span>)</span></button>
</nav>

  <div class="sheet-in">
    <div class="grab" aria-hidden="true"></div>
    <h2 id="sheetTitle"></h2>
    <div id="sheetOpts"></div>

      <button id="sheetClear" class="btn-text danger">Quitar selección</button>
      <button id="sheetClose" class="btn-sec">Cancelar</button>
    </div>
  </div>
</dialog>

<script type="module">
const POLYFILL = 'https://fastly.jsdelivr.net/npm/barcode-detector@2/dist/es/pure.min.js';
const KEY = 'codigos';
const FORMATS = ['code_128', 'code_39', 'code_93', 'ean_13', 'ean_8', 'upc_a', 'upc_e', 'itf', 'codabar', 'qr_code', 'data_matrix'];
const $ = s => document.querySelector(s);
const btn = $('#scan'), list = $('#list'), msg = $('#msg'), home = $('#home'), panel = $('#panel');
let video; // se crea uno nuevo en cada apertura: reusar el mismo en Safari deja el tamaño de la sesión anterior

// Registros { tag, serial, date }; los guardados con la versión anterior pasan a Tag
let rows = JSON.parse(localStorage.getItem(KEY) || '[]').map(r => r.code ? { tag: r.code, serial: '', date: r.date } : r);
let cur = rows.length - 1; // registro que se muestra y completa
let stream, detector, audio, target;
let sel = null; // registros marcados para asignar o borrar (índices); null = modo normal
// Opciones de cada campo de la lista
const FIELDS = {
  ubicacion: { label: 'ubicación', opts: ['Sin ubicación', 'Piso 8', 'Piso 5 Depósito', 'Piso 5', 'Piso 4', 'Piso 1 Depósito', 'Piso 1', 'PB', 'Oficina IT', 'Chile'] },
  estado: { label: 'estado', opts: ['Rotos', 'En reparación', 'Libres', 'Asignados'] },
  tipo: { label: 'tipo', opts: ['Otro', 'Equipo de red', 'Impresora', 'Dock / Adaptador', 'Cargador', 'Auriculares', 'Mouse', 'Teclado', 'Tablet', 'iPad', 'Celular Android', 'iPhone', 'Monitor', 'PC de escritorio', 'Notebook'] },
};
// Ubicaciones de la versión anterior: los depósitos pasan a la ubicación nueva; Reparar y Asignada pasan a Estado
const OLD = { 'Depósito 1ro': ['ubicacion', 'Piso 1 Depósito'], 'Depósito 5to': ['ubicacion', 'Piso 5 Depósito'],
  'Reparar': ['estado', 'En reparación'], 'Asignada': ['estado', 'Asignados'] };
for (const r of rows) {
  const o = OLD[r.ubicacion];
  if (o) { r.ubicacion = ''; r[o[0]] ||= o[1]; }
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// Lista: filas compactas con el estado de cada registro (vacío / incompleto / completo)
const filled = r => [r.tag, r.serial, r.ubicacion, r.estado, r.tipo].filter(Boolean).length;
function rowHTML(r, i) {
  const n = filled(r);
  const ring = sel
    ? `<span class="chk"><svg class="ic" aria-hidden="true"><use href="#i-check"/></svg></span>`
    : n === 5 ? `<span class="ring st2" aria-hidden="true"><svg class="ic"><use href="#i-check"/></svg></span>`
    : `<span class="ring ${n ? 'st1' : 'st0'}" aria-hidden="true">${n || ''}</span>`;
  const extra = [r.tipo, r.modelo, r.estado].filter(Boolean).join(' · ');
  const l3 = r.ubicacion ? [r.ubicacion, extra].filter(Boolean).join(' · ') : 'Falta ubicación' + (extra ? ' · ' + extra : '');
  const state = n === 5 ? 'completo' : `${n} de 5`;
  const attrs = sel
    ? `role="checkbox" aria-checked="${sel.has(i)}"`
    : `aria-label="Equipo ${i + 1}, Tag ${esc(r.tag || 'sin tag')}, ${state}${r.ubicacion ? '' : ', falta ubicación'}. Editar"`;
  return `<li><button class="item" data-i="${i}" ${attrs}>${ring}<span class="tx">` +
    `<span class="l1"><span class="code">${esc(r.tag || 'Sin tag')}</span></span>` +
    `<span class="ser" style="display:block">${r.serial ? esc(r.serial) : 'Sin serial'}</span>` +
    `<span class="l3${r.ubicacion ? '' : ' miss'}" style="display:block">${esc(l3)}</span>` +
    `</span>${sel ? '' : '<svg class="ic" aria-hidden="true"><use href="#i-chev"/></svg>'}</button></li>`;
}

// Hoja de edición: un registro (valores actuales) o varios (asignar en lote, "No cambiar" por defecto)
let editing = [];
function openEdit(idx) {
  editing = idx;
  const one = idx.length === 1, r = one ? rows[idx[0]] : {};
  $('#editTitle').textContent = one ? `Equipo ${idx[0] + 1}` : `Asignar a ${idx.length} equipos`;
  $('#editSub').textContent = one ? '' : 'Solo se cambia lo que elijas';
  $('#editSub').hidden = one;
  const field = f => `<div class="field" data-k="${f}"><div class="field-h"><span class="lab" id="lab-${f}">${{ ubicacion: 'Ubicación', estado: 'Estado', tipo: 'Tipo' }[f]}</span>` +
    `<span class="lab" style="font-weight:400;color:var(--text3)">${one ? '' : 'No cambiar'}</span></div>` +
    `<div class="chips" role="group" aria-labelledby="lab-${f}">` +
    FIELDS[f].opts.map(o => `<button data-v="${esc(o)}" aria-pressed="${r[f] === o}">${esc(o)}</button>`).join('') + '</div></div>';
  const modelos = [...new Set(rows.map(x => x.modelo).filter(Boolean))];
  const codeField = (f, label) => `<div class="field"><div class="field-h"><label for="e-${f}">${label}</label></div>` +
    `<input id="e-${f}" class="code-in" data-ecode="${f}" value="${esc(r[f] || '')}" placeholder="Escribí el ${label}" autocomplete="off" autocapitalize="characters" spellcheck="false">` +
    `<p id="em-${f}" class="code-msg" style="margin:var(--s1) 0 0" role="alert" hidden></p></div>`;
  $('#bulk').innerHTML = (one ? codeField('tag', 'Tag') + codeField('serial', 'Serial') : '') +
    Object.keys(FIELDS).map(field).join('') +
    `<div class="field"><div class="field-h"><label for="bModelo">Modelo</label></div>` +
    `<input id="bModelo" class="input" list="modelos" autocomplete="off" enterkeyhint="done" placeholder="${one ? 'Escribí el modelo' : 'No cambiar'}" value="${esc(r.modelo || '')}">` +
    `<datalist id="modelos">${modelos.map(m => `<option value="${esc(m)}">`).join('')}</datalist></div>`;
  canApply();
  $('#edit').showModal();
}
// Valores elegidos en la hoja: { ubicacion, estado, tipo, modelo }
function editVals() {
  const v = {};
  $('#bulk').querySelectorAll('.field[data-k]').forEach(d => { v[d.dataset.k] = d.querySelector('[aria-pressed="true"]')?.dataset.v || ''; });
  v.modelo = $('#bModelo').value.trim();
  $('#bulk').querySelectorAll('[data-ecode]').forEach(i => { v[i.dataset.ecode] = i.value.trim().toUpperCase(); });
  return v;
}
// En la hoja de un equipo: Tag / Serial no pueden repetirse con otro equipo ni entre sí
function editDup() {
  if (editing.length !== 1) return false;
  const v = editVals(); let bad = false;
  for (const f of ['tag', 'serial']) {
    const code = v[f], other = f === 'tag' ? v.serial : v.tag;
    const i = code ? rows.findIndex((r, j) => j !== editing[0] && (r.tag === code || r.serial === code)) : -1;
    const warn = i >= 0 ? `Ya está en la lista (equipo ${i + 1})` : code && code === other ? 'Es el mismo código que el otro campo' : '';
    $('#em-' + f).textContent = warn; $('#em-' + f).hidden = !warn;
    $('#e-' + f).classList.toggle('bad', !!warn);
    bad ||= !!warn;
  }
  return bad;
}
function canApply() {
  const one = editing.length === 1, v = editVals();
  const any = Object.values(v).some(Boolean), dup = editDup();
  $('#apply').disabled = one ? dup : !any;
  $('#apply').textContent = one ? (dup ? 'Corregí el código repetido' : 'Guardar') : any ? `Asignar a ${editing.length}` : 'Elegí al menos un valor';
}

function render() {
  list.innerHTML = rows.map(rowHTML).reverse().join('');
  list.hidden = !rows.length;
  $('#emptyList').hidden = !!rows.length;
  // Resumen arriba: cuántos hay y cuántos no se pueden exportar todavía
  const faltan = rows.filter(r => !r.ubicacion).length, comp = rows.filter(r => filled(r) === 5).length;
  $('#summary').innerHTML = !rows.length ? '' : sel
    ? `${sel.size} de ${rows.length} seleccionados`
    : `${rows.length} equipo${rows.length > 1 ? 's' : ''} · ${comp} completo${comp === 1 ? '' : 's'}` + (faltan ? ` · <b>${faltan} sin ubicación</b>` : '');
  $('#pick').hidden = !!sel || !rows.length;
  $('#cancel').hidden = !sel;
  $('#all').hidden = !sel;
  $('#acts').hidden = !!sel;
  $('#selbox').hidden = !sel;
  $('#csv').disabled = !rows.length;
  if (sel) {
    $('#n').textContent = $('#n2').textContent = sel.size;
    $('#del').disabled = $('#bulkOpen').disabled = !sel.size;
    $('#selHint').hidden = !!sel.size;
    $('#all').setAttribute('aria-checked', sel.size === rows.length);
  }
  $('#count').textContent = rows.length;
  $('#reset').disabled = !rows.length;
  renderCard();
  localStorage.setItem(KEY, JSON.stringify(rows)); // autoguardado
}

// ===== Escanear: ficha del registro actual y botón principal según el paso =====
const svg = id => `<svg class="ic" aria-hidden="true"><use href="#i-${id}"/></svg>`;
const STEP = { tag: 'Tag', serial: 'Serial' };
const blank = r => !r.tag && !r.serial && !r.ubicacion && !r.estado && !r.tipo && !r.modelo;
// Nuevo equipo: ficha vacía; Tag y Serial se escanean o escriben, ninguno es obligatorio.
// Si la ficha actual sigue vacía, se reutiliza en vez de sumar otra.
// Guarda el Tag / Serial que se está escribiendo (con el teclado abierto todavía no se guardó)
function flush() {
  const a = document.activeElement;
  if (a?.dataset?.code) { typed(a, true); a.blur(); }
}
function newRecord() {
  flush();
  if (!rows[cur] || !blank(rows[cur])) {
    rows.push({ tag: '', serial: '', date: new Date().toLocaleString('es-AR') });
    cur = rows.length - 1;
  }
  render();
}
// Código escrito a mano: mismo control de repetidos que al escanear (salvo el propio registro)
function dupOf(code, f) {
  const i = rows.findIndex((r, j) => j !== cur && (r.tag === code || r.serial === code));
  return i < 0 ? '' : `Ya está en la lista (equipo ${i + 1}): ${code}`;
}
function typed(input, commit) {
  const f = input.dataset.code, r = rows[cur];
  if (!r) return;
  const code = input.value.trim().toUpperCase();
  const own = f === 'tag' ? r.serial : r.tag; // no puede ser igual al otro campo del mismo equipo
  const warn = !code ? '' : dupOf(code, f) || (code === own ? `Es el mismo código que el ${f === 'tag' ? 'Serial' : 'Tag'}` : '');
  $('#msg-' + f).textContent = warn;
  $('#msg-' + f).hidden = !warn;
  input.classList.toggle('bad', !!warn);
  if (commit && !warn && r[f] !== code) { r[f] = code; input.value = code; render(); }
}

let shown = null; // equipo que muestra la ficha
function renderCard() {
  const r = rows[cur];
  const changed = r !== shown;
  shown = r;
  $('#empty').hidden = !!r;
  $('#card').hidden = !r;
  $('#home .dock').hidden = !r;
  $('#emptySub').textContent = rows.length ? 'Tocá para cargar otro' : 'Tocá para cargar el primero';
  if (r) {
    const done = [r.tag, r.serial, r.ubicacion, r.estado, r.tipo].map(Boolean);
    const n = done.filter(Boolean).length;
    $('#cardTitle').textContent = `Equipo ${cur + 1} de ${rows.length}`;
    $('#cardDate').textContent = r.date ? 'Escaneado ' + r.date : '';
    $('#prog').textContent = n === 5 ? '✓ Completo' : `${n} de 5`;
    $('#prog').classList.toggle('ok', n === 5);
    [...$('#bar5').children].forEach((b, i) => b.classList.toggle('on', done[i]));
    $('#bar5').classList.toggle('done', n === 5);
    for (const f of ['tag', 'serial']) {
      const inp = $('#' + f);
      if (changed || document.activeElement !== inp) { inp.value = r[f] || ''; inp.classList.remove('bad'); $('#msg-' + f).hidden = true; }
    }
    for (const f of Object.keys(FIELDS)) {
      $('#v-' + f).textContent = r[f] || `Elegí ${FIELDS[f].label}`;
      $('#v-' + f).classList.toggle('empty', !r[f]);
    }
    $('#reqU').hidden = !!r.ubicacion;
  }
  updateMain();
}

function updateMain() {
  const live = !!stream || busy;
  btn.classList.toggle('alt', live);
  btn.innerHTML = live ? svg('stop') + 'Detener' : svg('scan') + 'Nuevo equipo';
}

function setMsg(text) {
  msg.textContent = text;
  msg.hidden = !text;
  msg.classList.toggle('warn', /^(Ya está|Error)/.test(text));
}

// ===== Hoja inferior: elegir Ubicación / Estado / Tipo del registro actual =====
let sheetField = null;
function openSheet(f) {
  const r = rows[cur];
  if (!r) return;
  sheetField = f;
  $('#sheetTitle').textContent = { ubicacion: 'Ubicación', estado: 'Estado', tipo: 'Tipo' }[f];
  $('#sheetOpts').innerHTML = FIELDS[f].opts.map(o =>
    `<button class="opt" data-v="${esc(o)}" aria-pressed="${r[f] === o}"><span>${esc(o)}</span>${svg('check')}</button>`).join('');
  $('#sheetClear').hidden = !r[f];
  $('#sheet').showModal();
  ($('#sheetOpts [aria-pressed="true"]') || $('#sheetOpts .opt'))?.focus();
}
function setField(v) {
  rows[cur][sheetField] = v;
  $('#sheet').close();
  render();
}

function beep() {
  navigator.vibrate?.(80);
  const o = audio.createOscillator();
  o.frequency.value = 1200;
  o.connect(audio.destination);
  o.start();
  o.stop(audio.currentTime + 0.08);
}

async function getDetector() {
  if (!detector) {
    // Nativo en Chrome/Android; en Safari/iOS se carga el polyfill
    const BD = window.BarcodeDetector ?? (await import(POLYFILL)).BarcodeDetector;
    const ok = await BD.getSupportedFormats();
    detector = new BD({ formats: FORMATS.filter(f => ok.includes(f)) });
  }
  return detector;
}

// Guarda el código leído: registro nuevo (Tag) o campo del registro actual. Devuelve aviso si está repetido
function save(code) {
  if (rows.some(r => r.tag === code || r.serial === code)) return 'Ya está en la lista: ' + code;
  if (target === 'new') {
    rows.push({ tag: code, serial: '', date: new Date().toLocaleString('es-AR') });
    cur = rows.length - 1;
  } else rows[cur][target] = code;
  beep();
  render();
  return '';
}

// Lee sobre el cuadro completo; al leer congela la imagen y muestra el código 1,2 s antes de cerrar
async function loop(s) {
  while (stream === s) {
    try {
      fit(); // por si Safari no avisa que la imagen cambió de forma
      if (video.readyState >= 2) {
        const [hit] = await detector.detect(video);
        if (hit && stream === s) {
          video.pause();
          const warn = save(hit.rawValue), ok = $('#ok');
          ok.textContent = warn || '✓ ' + hit.rawValue;
          ok.style.color = warn ? '#ff9f0a' : '';
          ok.hidden = false;
          await new Promise(r => setTimeout(r, 1200));
          if (stream === s) { stop(); setMsg(warn); }
          return;
        }
      }
    } catch (e) { setMsg('Error de lectura: ' + e.message); }
    await new Promise(r => setTimeout(r, 150));
  }
}

let busy = false; // evita abrir dos cámaras si se toca dos veces
const SIZE = { width: { ideal: 1920 }, height: { ideal: 1080 } };
const ANDROID = /Android/i.test(navigator.userAgent);
// Cada pedido va en su propio grupo "advanced": si el celular no soporta uno (p. ej. enfoque), el zoom igual se aplica.
// El enfoque continuo se pide solo en Android: muchos (Samsung) quedan con foco fijo si la página no lo pide.
const want = zoom => ({ ...SIZE, advanced: [{ zoom }, ...(ANDROID ? [{ focusMode: 'continuous' }] : [])] });
const autofocus = s => s.getVideoTracks()[0].getCapabilities?.().focusMode?.includes('continuous');

async function openCam(zoom) {
  const get = id => navigator.mediaDevices.getUserMedia({
    audio: false, video: { ...(id ? { deviceId: { exact: id } } : { facingMode: 'environment' }), ...want(zoom) }
  });
  if (!ANDROID) return get(); // iPhone: sin cambios
  const saved = localStorage.getItem('camAF');
  let s;
  try { s = await get(saved); } catch (e) { if (!saved) throw e; localStorage.removeItem('camAF'); s = await get(); }
  if (autofocus(s)) return s;
  // La cámara que eligió Chrome no enfoca (en el S22, la ultra gran angular tiene foco fijo):
  // prueba las otras cámaras traseras y recuerda la primera con enfoque automático
  const cur = s.getVideoTracks()[0].getSettings().deviceId;
  const cams = (await navigator.mediaDevices.enumerateDevices())
    .filter(d => d.kind === 'videoinput' && d.deviceId !== cur && /back|rear|trasera|environment/i.test(d.label));
  s.getTracks().forEach(t => t.stop()); // Android abre una cámara por vez
  for (const d of cams) {
    try {
      const t = await get(d.deviceId);
      if (autofocus(t)) { localStorage.setItem('camAF', d.deviceId); return t; }
      t.getTracks().forEach(x => x.stop());
    } catch {}
  }
  localStorage.removeItem('camAF');
  return get(); // ninguna enfoca sola: vuelve a la de siempre
}

async function start(t) {
  if (busy) return;
  busy = true;
  stop();
  target = t;
  updateMain();
  try {
    if (!navigator.mediaDevices?.getUserMedia) throw new Error('la cámara requiere abrir la página con https://');
    audio ??= new AudioContext(); // se crea tras un toque (requisito de iOS)
    setMsg('Abriendo cámara…');
    await getDetector();
    const zoom = +localStorage.getItem('zoom') || 1;
    // El zoom se pide al abrir: cambiarlo después en Safari puede bajar la resolución y dejar la imagen vertical
    stream = await openCam(zoom);
    video = document.createElement('video');
    video.muted = video.playsInline = video.autoplay = true;
    video.setAttribute('playsinline', '');
    video.addEventListener('resize', fit);
    $('#cam').prepend(video);
    video.srcObject = stream;
    $('#cam').hidden = false;
    await video.play();
    fit();
    setupZoom();
    $('#aim').textContent = `Apuntá al ${STEP[t] || 'Tag'}`;
    setMsg('');
    loop(stream);
  } catch (e) {
    stop();
    setMsg('Error: ' + e.message);
  } finally {
    busy = false;
    updateMain();
  }
}

// Ajusta el video para que siempre llene el cuadro, sin depender de object-fit (Safari no lo redibuja bien
// cuando el iPhone gira los cuadros de horizontal a vertical al abrir la cámara). Se vuelve a calcular en cada cambio.
function fit() {
  const vw = video?.videoWidth, vh = video?.videoHeight, c = $('#cam');
  if (!vw || !vh || c.hidden) return;
  const s = Math.max(c.clientWidth / vw, c.clientHeight / vh);
  const w = vw * s + 'px', h = vh * s + 'px';
  if (video.style.width === w && video.style.height === h) return;
  video.style.width = w;
  video.style.height = h;
  video.style.visibility = 'visible';
}
addEventListener('resize', fit);

// Zoom real de la cámara (iOS 17+ / Chrome Android): amplía la imagen que se analiza.
// Permite alejar el celular hasta donde enfoca y que el código igual se vea grande. Se recuerda el último.
function setupZoom() {
  const track = stream.getVideoTracks()[0], z = track.getCapabilities?.().zoom;
  [...$('#zoom').children].forEach(b => b.hidden = !z || +b.dataset.z > z.max);
  $('#zoom').hidden = !z || z.max < 2;
  mark(track.getSettings().zoom ?? 1);
}

const mark = v => [...$('#zoom').children].forEach(b => b.classList.toggle('on', +b.dataset.z === Math.round(v)));

async function setZoom(v) {
  const track = stream?.getVideoTracks()[0], z = track?.getCapabilities?.().zoom;
  if (!z) return;
  v = Math.min(Math.max(v, z.min), z.max);
  try {
    // Se repite resolución (y enfoque en Android): applyConstraints reemplaza todo lo pedido antes
    await track.applyConstraints(want(v));
    localStorage.setItem('zoom', v);
    mark(v);
  } catch {}
}

function stop() {
  if (video) { video.srcObject = null; video.remove(); video = null; }
  stream?.getTracks().forEach(t => t.stop());
  stream = null;
  $('#cam').hidden = true;
  $('#ok').hidden = true;
  setMsg('');
  updateMain();
}

// Mismas columnas y en el mismo orden que "Inventario IT - Planilla para importar.xlsx".
// Por ahora se completan Tag, Tipo, Modelo, N° de serie, Estado y Ubicación.
const COLS = ['Tag', 'Usuario', 'Email', 'Posición', 'Área', 'Contratación', 'Tipo', 'Marca', 'Modelo', 'Año',
  'N° de serie', 'Estado', 'Condición', 'Ubicación', 'Fecha de compra', 'Costo', 'Moneda', 'Proveedor', 'Factura',
  'Link factura', 'Garantía hasta', 'Notas', 'RAM', 'Disco', 'N° de solicitud de gasto', 'N° de orden de compra'];

async function exportCSV() {
  if (!rows.length) return alert('No hay registros');
  const faltan = rows.filter(r => !r.ubicacion).length;
  if (faltan) {
    alert(`Falta la ubicación en ${faltan} registro${faltan > 1 ? 's' : ''}. Completala antes de exportar.`);
    return list.querySelector('.miss')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  const q = s => `"${String(s ?? '').replace(/"/g, '""')}"`;
  const data = rows.map(r => ({ 'Tag': r.tag, 'Tipo': r.tipo, 'Modelo': r.modelo, 'N° de serie': r.serial, 'Estado': r.estado, 'Ubicación': r.ubicacion }));
  const lines = [COLS, ...data.map(d => COLS.map(c => d[c]))];
  // BOM + ";" para que Excel en español lo abra con acentos y columnas bien
  const csv = '\ufeff' + lines.map(l => l.map(q).join(';')).join('\r\n');
  const name = `escaneos_${new Date().toISOString().slice(0, 10)}.csv`;
  const file = new File([csv], name, { type: 'text/csv' });
  if (navigator.canShare?.({ files: [file] })) {
    try { await navigator.share({ files: [file] }); } catch {} // celular: menú Compartir
  } else {
    const a = document.createElement('a'); // computadora: descarga
    a.href = URL.createObjectURL(file);
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
}

// El botón principal hace el paso que falta: Tag → Serial → siguiente equipo
// Botón principal: nueva ficha (o detener la cámara si está abierta). La cámara se abre desde cada campo.
btn.onclick = () => stream ? stop() : newRecord();
$('#empty').onclick = newRecord;
$('#card').onclick = e => {
  const b = e.target.closest('button');
  if (b) flush();
  if (b?.dataset.f) start(b.dataset.f);
  else if (b?.dataset.pick) openSheet(b.dataset.pick);
};
// Tag / Serial a mano: avisa repetidos mientras se escribe y guarda al salir del campo o tocar Enter
$('#card').addEventListener('input', e => { if (e.target.dataset.code) typed(e.target, false); });
$('#card').addEventListener('change', e => { if (e.target.dataset.code) typed(e.target, true); });
$('#card').addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !e.target.dataset.code) return;
  e.preventDefault();
  e.target.dataset.code === 'tag' ? $('#serial').focus() : e.target.blur();
});
$('#sheetOpts').onclick = e => { const o = e.target.closest('.opt'); if (o) setField(o.dataset.v); };
$('#sheetClear').onclick = () => setField('');
$('#sheetClose').onclick = () => $('#sheet').close();
$('#sheet').onclick = e => { if (e.target === $('#sheet')) $('#sheet').close(); }; // tocar fuera cierra
$('#zoom').onclick = e => { const z = e.target.closest('button')?.dataset.z; if (z) setZoom(+z); };
const tab = toList => {
  $('#back').toggleAttribute('aria-current', !toList);
  $('#open').toggleAttribute('aria-current', toList);
  $(toList ? '#open' : '#back').setAttribute('aria-current', 'page');
};
$('#open').onclick = () => {
  flush();
  if (rows[cur] && blank(rows[cur])) { rows.splice(cur, 1); cur = rows.length - 1; render(); }
  stop(); home.hidden = true; panel.hidden = false; tab(true); scrollTo(0, 0); };
$('#back').onclick = () => { sel = null; render(); panel.hidden = true; home.hidden = false; tab(false); scrollTo(0, 0); };
$('#csv').onclick = exportCSV;
// Lista: tocar un registro lo abre para editar; en modo selección lo marca o desmarca
list.onclick = e => {
  const b = e.target.closest('.item');
  if (!b) return;
  const i = +b.dataset.i;
  if (sel) { sel.has(i) ? sel.delete(i) : sel.add(i); render(); }
  else openEdit([i]);
};
// Seleccionar: marca uno, varios o todos para asignarles los mismos valores o borrarlos
$('#pick').onclick = () => { if (rows.length) { sel = new Set(); render(); } };
$('#bulkOpen').onclick = () => { if (sel?.size) openEdit([...sel]); };
$('#editClose').onclick = () => $('#edit').close();
$('#edit').onclick = e => { if (e.target === $('#edit')) $('#edit').close(); }; // tocar fuera cierra
// Botones de opciones: tocar elige, tocar de nuevo vuelve a "No cambiar" / vacío
$('#bulk').onclick = e => {
  const c = e.target.closest('.chips button');
  if (!c) return;
  const on = c.getAttribute('aria-pressed') === 'true';
  c.parentElement.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', 'false'));
  if (!on) c.setAttribute('aria-pressed', 'true');
  canApply();
};
$('#bulk').oninput = canApply;
$('#apply').onclick = () => {
  if (!editing.length || editDup()) return;
  const vals = editVals();
  if (editing.length === 1) {
    // Un registro: se guarda lo que cambió en la hoja (vacío = sin valor); lo que no cambió no se toca
    const r = rows[editing[0]];
    for (const [k, v] of Object.entries(vals)) if (v !== (r[k] || '')) r[k] = v;
  } else {
    // Varios: solo se aplican los campos elegidos; los que quedan en "No cambiar" no se tocan
    for (const k of Object.keys(vals)) if (!vals[k]) delete vals[k];
    sel.forEach(i => Object.assign(rows[i], vals));
    sel = null;
  }
  $('#edit').close();
  render();
};
$('#cancel').onclick = () => { sel = null; render(); };
$('#all').onclick = () => { sel = new Set(sel.size === rows.length ? [] : rows.keys()); render(); };
$('#del').onclick = () => {
  const n = sel.size;
  if (!n || !confirm(`¿Borrar ${n} registro${n > 1 ? 's' : ''}?`)) return;
  const shown = rows[cur];
  rows = rows.filter((_, i) => !sel.has(i));
  cur = rows.indexOf(shown); // si se borró el que estaba en pantalla, la ficha se oculta
  sel = null;
  render();
};
// Empezar un escaneo nuevo: borra todos los registros. Se guarda la lista vacía, así al recargar no vuelven.
$('#reset').onclick = () => {
  const n = rows.length;
  if (!n || !confirm(`¿Empezar un escaneo nuevo?\n\nSe borran los ${n} equipo${n > 1 ? 's' : ''} de la lista. Si los necesitás, exportá el CSV antes.`)) return;
  stop();
  if ($('#sheet').open) $('#sheet').close();
  rows = [];
  cur = -1;
  sel = null;
  render(); // guarda la lista vacía en la clave "codigos"
  scrollTo(0, 0);
};
document.onvisibilitychange = () => document.hidden && stop();

render();
</script>
</body>
