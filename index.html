<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Escáner</title>
<style>
  :root { color-scheme: light dark; --accent: #0a84ff; }
  * { box-sizing: border-box; }
  body { margin: 0 auto; max-width: 600px; padding: 40px 12px 12px; font: 16px -apple-system, system-ui, sans-serif; }
  h1 { font-size: 20px; margin: 4px 0 12px; }
  #cam { position: relative; height: 55vh; height: 55svh; background: #000; border-radius: 12px; overflow: hidden; }
  #cam[hidden] { display: none; }
  #cam video { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); visibility: hidden; }
  #ok { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; background: #000a; color: #30d158; font: 700 24px ui-monospace, monospace; text-align: center; word-break: break-all; }
  #ok[hidden] { display: none; }
  #zoom { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; gap: 6px; padding: 4px; border-radius: 22px; background: #0008; }
  #zoom[hidden] { display: none; }
  #zoom button { flex: none; width: 44px; height: 36px; padding: 0; border-radius: 18px; background: none; color: #fff; font: 600 14px system-ui; }
  #zoom button.on { background: #fff3; color: #ffd60a; }
  .bar { display: flex; justify-content: center; gap: 10px; margin: 12px 0; }
  .bar[hidden] { display: none; }
  button { flex: 1; max-width: 220px; padding: 22px; border: 0; border-radius: 14px; font: 600 19px system-ui; background: var(--accent); color: #fff; }
  button.sec { background: #8884; color: inherit; }
  #scan { max-width: 320px; padding: 28px; font-size: 23px; }
  #msg { min-height: 1.3em; margin: 8px 0; text-align: center; color: #888; font-size: 14px; word-break: break-all; }
  #card { margin: 12px 0; padding: 6px 14px; border-radius: 14px; background: #8882; }
  .f { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
  .f + .f { border-top: 1px solid #8883; }
  .f b { width: 76px; color: #888; font: 600 14px system-ui; }
  .f span { flex: 1; font: 600 20px ui-monospace, monospace; word-break: break-all; }
  select { flex: 1; min-width: 0; padding: 10px; border: 1px solid #8886; border-radius: 10px; background: #8881; color: inherit; font: 600 17px system-ui; }
  li select { width: 100%; margin-top: 8px; }
  li.miss { border-left: 4px solid #ff9f0a; padding-left: 8px; }
  li.miss select { border-color: #ff9f0a; }
  button.mini { flex: none; padding: 10px 14px; font-size: 18px; border-radius: 10px; }
  ol { padding-left: 2.5em; word-break: break-all; }
  li { padding: 8px 0; border-bottom: 1px solid #8883; font-family: ui-monospace, monospace; }
  li b { color: #888; font: 600 13px system-ui; }
  button.danger { background: #ff453a; }
  button:disabled { opacity: .4; }
  #allrow { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #8883; font-weight: 600; }
  #selbox[hidden] { display: none; }
  /* Asignar en lote: misma ubicación y/o modelo a los seleccionados */
  #bulk { margin: 12px 0; padding: 6px 14px 14px; border-radius: 14px; background: #8882; }
  #bModelo { flex: 1; min-width: 0; padding: 10px; border: 1px solid #8886; border-radius: 10px; background: #8881; color: inherit; font: 600 17px system-ui; }
  #apply { display: block; width: 100%; max-width: none; margin-top: 8px; padding: 16px; }
  /* En modo selección el círculo reemplaza al número, así no se superponen */
  ol.sel { list-style: none; padding-left: 0; }
  li label { display: flex; align-items: center; gap: 12px; padding: 4px 0; }
  /* Selector redondo */
  input[type=checkbox] { -webkit-appearance: none; appearance: none; flex: none; width: 26px; height: 26px; margin: 0; border: 2px solid #8889; border-radius: 50%; }
  input[type=checkbox]:checked { border-color: var(--accent); background: radial-gradient(var(--accent) 0 45%, transparent 50%); }
</style>
</head>
<body>
<main id="home">
  <h1>Escáner de códigos</h1>
  <div id="cam" hidden>
    <div id="zoom" hidden><button data-z="1">1x</button><button data-z="2">2x</button><button data-z="3">3x</button></div>
    <div id="ok" hidden></div></div>
  <div class="bar"><button id="scan">📷 Escanear</button></div>
  <div id="msg"></div>
  <div id="card" hidden>
    <div class="f"><b>Tag</b><span id="tag"></span><button class="mini" data-f="tag" aria-label="Escanear tag">📷</button></div>
    <div class="f"><b>Serial</b><span id="serial"></span><button class="mini" data-f="serial" aria-label="Escanear serial">📷</button></div>
    <div class="f"><b>Ubicación</b><select id="ubic"></select></div>
  </div>
  <div class="bar"><button id="open" class="sec">📋 Ver lista (<span id="count">0</span>)</button></div>
</main>

<section id="panel" hidden>
  <div class="bar"><button id="back" class="sec">← Volver</button></div>
  <div class="bar" id="acts">
    <button id="csv">📤 Exportar CSV</button>
    <button id="pick" class="sec">☑ Seleccionar</button>
  </div>
  <div id="selbox" hidden>
    <div id="bulk">
      <div class="f"><b>Ubicación</b><select id="bUbic"></select></div>
      <div class="f"><b>Modelo</b><input id="bModelo" list="modelos" placeholder="No cambiar" autocomplete="off"></div>
      <datalist id="modelos"></datalist>
      <button id="apply">✓ Asignar a <span id="n2">0</span></button>
    </div>
    <div class="bar">
      <button id="del" class="danger">🗑 Borrar (<span id="n">0</span>)</button>
      <button id="cancel" class="sec">Cancelar</button>
    </div>
    <label id="allrow"><input type="checkbox" id="all"> Seleccionar todos</label>
  </div>
  <ol id="list" reversed></ol>
</section>

<script type="module">
const POLYFILL = 'https://fastly.jsdelivr.net/npm/barcode-detector@2/dist/es/pure.min.js';
const KEY = 'codigos';
const FORMATS = ['code_128', 'code_39', 'code_93', 'ean_13', 'ean_8', 'upc_a', 'upc_e', 'itf', 'codabar', 'qr_code', 'data_matrix'];
const $ = s => document.querySelector(s);
const btn = $('#scan'), list = $('#list'), msg = $('#msg'), home = $('#home'), panel = $('#panel');
let video; // se crea uno nuevo en cada apertura: reusar el mismo en Safari deja el tamaño de la sesión anterior

// Registros { tag, serial, date }; los guardados con la versión anterior pasan a Tag
let rows = JSON.parse(localStorage.getItem(KEY) || '[]').map(r => r.code ? { tag: r.code, serial: '', date: r.date } : r);
let cur = rows.length - 1; // registro que se muestra y completa
let stream, detector, audio, target;
let sel = null; // registros marcados para borrar (índices); null = modo normal
const UBIC = ['Depósito 1ro', 'Depósito 5to', 'Reparar', 'Asignada'];
const opts = v => '<option value="">Elegí ubicación…</option>' + UBIC.map(u => `<option${u === v ? ' selected' : ''}>${u}</option>`).join('');

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function render() {
  list.innerHTML = rows.map((r, i) => {
    const txt = `<span><b>Tag</b> ${esc(r.tag || '—')}<br><b>Serial</b> ${esc(r.serial || '—')}` +
      (r.modelo ? `<br><b>Modelo</b> ${esc(r.modelo)}` : '') + '</span>';
    return sel
      ? `<li><label><input type="checkbox" data-i="${i}"${sel.has(i) ? ' checked' : ''}>${txt}</label></li>`
      : `<li${r.ubicacion ? '' : ' class="miss"'}>${txt}<select data-u="${i}">${opts(r.ubicacion)}</select></li>`;
  }).reverse().join('');
  list.classList.toggle('sel', !!sel);
  $('#acts').hidden = !!sel;
  $('#selbox').hidden = !sel;
  if (sel) {
    $('#n').textContent = $('#n2').textContent = sel.size;
    $('#del').disabled = !sel.size;
    $('#all').checked = sel.size === rows.length;
    canApply();
  }
  $('#count').textContent = rows.length;
  const r = rows[cur];
  $('#card').hidden = !r;
  if (r) { $('#tag').textContent = r.tag || '—'; $('#serial').textContent = r.serial || '—'; $('#ubic').innerHTML = opts(r.ubicacion); }
  localStorage.setItem(KEY, JSON.stringify(rows)); // autoguardado
}

function beep() {
  navigator.vibrate?.(80);
  const o = audio.createOscillator();
  o.frequency.value = 1200;
  o.connect(audio.destination);
  o.start();
  o.stop(audio.currentTime + 0.08);
}

async function getDetector() {
  if (!detector) {
    // Nativo en Chrome/Android; en Safari/iOS se carga el polyfill
    const BD = window.BarcodeDetector ?? (await import(POLYFILL)).BarcodeDetector;
    const ok = await BD.getSupportedFormats();
    detector = new BD({ formats: FORMATS.filter(f => ok.includes(f)) });
  }
  return detector;
}

// Guarda el código leído: registro nuevo (Tag) o campo del registro actual. Devuelve aviso si está repetido
function save(code) {
  if (rows.some(r => r.tag === code || r.serial === code)) return 'Ya está en la lista: ' + code;
  if (target === 'new') {
    rows.push({ tag: code, serial: '', date: new Date().toLocaleString('es-AR') });
    cur = rows.length - 1;
  } else rows[cur][target] = code;
  beep();
  render();
  return '';
}

// Lee sobre el cuadro completo; al leer congela la imagen y muestra el código 1,2 s antes de cerrar
async function loop(s) {
  while (stream === s) {
    try {
      fit(); // por si Safari no avisa que la imagen cambió de forma
      if (video.readyState >= 2) {
        const [hit] = await detector.detect(video);
        if (hit && stream === s) {
          video.pause();
          const warn = save(hit.rawValue), ok = $('#ok');
          ok.textContent = warn || '✓ ' + hit.rawValue;
          ok.style.color = warn ? '#ff9f0a' : '';
          ok.hidden = false;
          await new Promise(r => setTimeout(r, 1200));
          if (stream === s) { stop(); msg.textContent = warn; }
          return;
        }
      }
    } catch (e) { msg.textContent = 'Error de lectura: ' + e.message; }
    await new Promise(r => setTimeout(r, 150));
  }
}

let busy = false; // evita abrir dos cámaras si se toca dos veces
async function start(t) {
  if (busy) return;
  busy = true;
  stop();
  target = t;
  try {
    if (!navigator.mediaDevices?.getUserMedia) throw new Error('la cámara requiere abrir la página con https://');
    audio ??= new AudioContext(); // se crea tras un toque (requisito de iOS)
    msg.textContent = 'Abriendo cámara…';
    await getDetector();
    const SIZE = { width: { ideal: 1920 }, height: { ideal: 1080 } }, zoom = +localStorage.getItem('zoom') || 1;
    // El zoom se pide al abrir: cambiarlo después en Safari puede bajar la resolución y dejar la imagen vertical
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: 'environment', ...SIZE, advanced: [{ zoom }] }
    });
    video = document.createElement('video');
    video.muted = video.playsInline = video.autoplay = true;
    video.setAttribute('playsinline', '');
    video.addEventListener('resize', fit);
    $('#cam').prepend(video);
    video.srcObject = stream;
    $('#cam').hidden = false;
    await video.play();
    fit();
    setupZoom();
    btn.textContent = '⏹ Detener';
    msg.textContent = `Apuntá al ${t === 'serial' ? 'Serial' : 'Tag'}`;
    loop(stream);
  } catch (e) {
    stop();
    msg.textContent = 'Error: ' + e.message;
  } finally {
    busy = false;
  }
}

// Ajusta el video para que siempre llene el cuadro, sin depender de object-fit (Safari no lo redibuja bien
// cuando el iPhone gira los cuadros de horizontal a vertical al abrir la cámara). Se vuelve a calcular en cada cambio.
function fit() {
  const vw = video?.videoWidth, vh = video?.videoHeight, c = $('#cam');
  if (!vw || !vh || c.hidden) return;
  const s = Math.max(c.clientWidth / vw, c.clientHeight / vh);
  const w = vw * s + 'px', h = vh * s + 'px';
  if (video.style.width === w && video.style.height === h) return;
  video.style.width = w;
  video.style.height = h;
  video.style.visibility = 'visible';
}
addEventListener('resize', fit);

// Zoom real de la cámara (iOS 17+ / Chrome Android): amplía la imagen que se analiza.
// Permite alejar el celular hasta donde enfoca y que el código igual se vea grande. Se recuerda el último.
function setupZoom() {
  const track = stream.getVideoTracks()[0], z = track.getCapabilities?.().zoom;
  [...$('#zoom').children].forEach(b => b.hidden = !z || +b.dataset.z > z.max);
  $('#zoom').hidden = !z || z.max < 2;
  mark(track.getSettings().zoom ?? 1);
}

const mark = v => [...$('#zoom').children].forEach(b => b.classList.toggle('on', +b.dataset.z === Math.round(v)));

async function setZoom(v) {
  const track = stream?.getVideoTracks()[0], z = track?.getCapabilities?.().zoom;
  if (!z) return;
  v = Math.min(Math.max(v, z.min), z.max);
  try {
    // Se repite la resolución para que Safari no la cambie al aplicar el zoom
    await track.applyConstraints({ width: { ideal: 1920 }, height: { ideal: 1080 }, advanced: [{ zoom: v }] });
    localStorage.setItem('zoom', v);
    mark(v);
  } catch {}
}

function stop() {
  if (video) { video.srcObject = null; video.remove(); video = null; }
  stream?.getTracks().forEach(t => t.stop());
  stream = null;
  $('#cam').hidden = true;
  $('#ok').hidden = true;
  btn.textContent = '📷 Escanear';
  msg.textContent = '';
}

// Mismas columnas y en el mismo orden que "Inventario IT - Planilla para importar.xlsx".
// Por ahora se completan Tag, Modelo, N° de serie y Ubicación.
const COLS = ['Tag', 'Usuario', 'Email', 'Posición', 'Área', 'Contratación', 'Tipo', 'Marca', 'Modelo', 'Año',
  'N° de serie', 'Estado', 'Condición', 'Ubicación', 'Fecha de compra', 'Costo', 'Moneda', 'Proveedor', 'Factura',
  'Link factura', 'Garantía hasta', 'Notas', 'RAM', 'Disco', 'N° de solicitud de gasto', 'N° de orden de compra'];

async function exportCSV() {
  if (!rows.length) return alert('No hay registros');
  const faltan = rows.filter(r => !r.ubicacion).length;
  if (faltan) {
    alert(`Falta la ubicación en ${faltan} registro${faltan > 1 ? 's' : ''}. Completala antes de exportar.`);
    return list.querySelector('.miss')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  const q = s => `"${String(s ?? '').replace(/"/g, '""')}"`;
  const data = rows.map(r => ({ 'Tag': r.tag, 'Modelo': r.modelo, 'N° de serie': r.serial, 'Ubicación': r.ubicacion }));
  const lines = [COLS, ...data.map(d => COLS.map(c => d[c]))];
  // BOM + ";" para que Excel en español lo abra con acentos y columnas bien
  const csv = '\ufeff' + lines.map(l => l.map(q).join(';')).join('\r\n');
  const name = `escaneos_${new Date().toISOString().slice(0, 10)}.csv`;
  const file = new File([csv], name, { type: 'text/csv' });
  if (navigator.canShare?.({ files: [file] })) {
    try { await navigator.share({ files: [file] }); } catch {} // celular: menú Compartir
  } else {
    const a = document.createElement('a'); // computadora: descarga
    a.href = URL.createObjectURL(file);
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
}

btn.onclick = () => stream ? stop() : start('new');
$('#card').onclick = e => { const f = e.target.closest('.mini')?.dataset.f; if (f) start(f); };
$('#zoom').onclick = e => { const z = e.target.closest('button')?.dataset.z; if (z) setZoom(+z); };
$('#open').onclick = () => { stop(); home.hidden = true; panel.hidden = false; };
$('#back').onclick = () => { sel = null; render(); panel.hidden = true; home.hidden = false; };
$('#csv').onclick = exportCSV;
// Ubicación: desde la ficha (registro actual) o desde cada registro de la lista
$('#ubic').onchange = e => { rows[cur].ubicacion = e.target.value; render(); };
list.addEventListener('change', e => {
  const i = e.target.dataset.u;
  if (i != null) { rows[+i].ubicacion = e.target.value; render(); }
});
// Seleccionar: marca uno, varios o todos para asignarles ubicación/modelo o borrarlos
$('#pick').onclick = () => {
  if (!rows.length) return alert('No hay registros');
  sel = new Set();
  $('#bUbic').innerHTML = '<option value="">No cambiar</option>' + UBIC.map(u => `<option>${u}</option>`).join('');
  $('#bModelo').value = '';
  // Sugiere los modelos ya cargados para escribirlos igual en todos
  $('#modelos').innerHTML = [...new Set(rows.map(r => r.modelo).filter(Boolean))].map(m => `<option value="${esc(m)}">`).join('');
  render();
};
function canApply() {
  $('#apply').disabled = !sel?.size || !($('#bUbic').value || $('#bModelo').value.trim());
}
$('#bUbic').onchange = $('#bModelo').oninput = canApply;
$('#apply').onclick = () => {
  const u = $('#bUbic').value, m = $('#bModelo').value.trim();
  sel.forEach(i => { if (u) rows[i].ubicacion = u; if (m) rows[i].modelo = m; });
  sel = null;
  render();
};
$('#cancel').onclick = () => { sel = null; render(); };
$('#all').onchange = e => { sel = new Set(e.target.checked ? rows.keys() : []); render(); };
list.onchange = e => {
  const i = e.target.dataset.i;
  if (i == null) return;
  e.target.checked ? sel.add(+i) : sel.delete(+i);
  render();
};
$('#del').onclick = () => {
  const n = sel.size;
  if (!n || !confirm(`¿Borrar ${n} registro${n > 1 ? 's' : ''}?`)) return;
  const shown = rows[cur];
  rows = rows.filter((_, i) => !sel.has(i));
  cur = rows.indexOf(shown); // si se borró el que estaba en pantalla, la ficha se oculta
  sel = null;
  render();
};
document.onvisibilitychange = () => document.hidden && stop();

render();
</script>
</body>
</html>
